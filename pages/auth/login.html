<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل دخول الإدارة | Dandy</title>
  <meta name="robots" content="noindex, nofollow">

  <link href="../../assets/css/style.css" rel="stylesheet" />
  <link href="../../assets/css/layout.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    .login-container {
      min-height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 120px;
      padding-bottom: 60px;
    }

    .login-box {
      background: var(--color-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--border-radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .login-box h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--color-primary);
      margin-bottom: 8px;
    }

    .login-box p {
      color: var(--color-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .form-group {
      text-align: right;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--color-primary);
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-light);
      border-radius: var(--border-radius-sm);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition-fast);
    }

    .form-group input:focus {
      border-color: var(--color-blush);
      box-shadow: 0 0 0 3px rgba(217, 141, 153, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--color-blush);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 99px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(217, 141, 153, 0.2);
      transition: var(--transition-smooth);
    }

    .btn-login:hover {
      background: var(--color-primary);
    }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NH8NG47PDV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NH8NG47PDV');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>





<main class="login-container container">
  <div class="login-box">
    <i class="fas fa-user-shield" style="font-size:3rem; color:var(--color-blush); margin-bottom:16px;"></i>
    <h2>الدخول للوحة العمليات</h2>
    <p>مخصص لمشرفي وموظفي متجر داندي للتجميل</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="l-email">البريد الإلكتروني المعتمد</label>
        <input type="email" id="l-email" placeholder="admin@dandy.com" required>
      </div>

      <div class="form-group" style="position: relative;">
        <label for="l-pass">كلمة المرور الحزامية</label>
        <input type="password" id="l-pass" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login" style="margin-top: 10px;">تسجيل الدخول الآمن</button>
    </form>
  </div>
</main>



<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDqYY4EF0Nig9aBOxmWZJA8D-4Gr4tT-UU",
    authDomain: "dandy-562fc.firebaseapp.com",
    projectId: "dandy-562fc",
    storageBucket: "dandy-562fc.appspot.com",
    messagingSenderId: "454972972842",
    appId: "1:454972972842:web:fedc5e92e258a06ca08853"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Handle active states of navbar menu on scroll
  // Toggle Menubar drawer for mobile
  
  // Active check redirect if already signed in
  auth.onAuthStateChanged(user => {
    if (user) {
      window.location.href = '../dashboard/dashboard.html';
    }
  });

  // Handle secure submit login credentials
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('l-email').value.trim();
    const password = document.getElementById('l-pass').value.trim();

    try {
      await auth.signInWithEmailAndPassword(email, password);
      // Automatic redirect triggers onAuthStateChanged above
    } catch (err) {
      alert('بينات الدخول خاطئة أو غير مسجلة! نرجو مراجعة مسؤول النظام للتحقق.');
    }
  });
</script>

<script src="../../assets/js/layout.js"></script>
</body>
</html>
