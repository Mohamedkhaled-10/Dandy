  <style>
    :root {
      /* Premium Skincare & Beauty Luxury Palette */
      --color-canvas: #ffffff;
      --color-surface: #ffffff;
      --color-surface-soft: #fdf2f8;
      
      --color-primary: #db2777;
      --color-text: #262626;
      --color-muted: #7a7a7a;
      
      --color-blush: #db2777;
      --color-primary-hover: #be185d;
      --color-blush-soft: #fdf2f8;
      --color-gold: #f472b6;
      --color-gold-cream: #fdf2f8;
      
      --color-success: #2e6648;
      --color-danger: #a82e3a;
      --color-warning: #b37524;
      
      /* Borders, shadows and roundness */
      --border-light: #fbcfe8;
      --border-blush: #fbcfe8;
      --border-radius-sm: 8px;
      --border-radius-md: 14px;
      --border-radius-lg: 24px;
      
      /* Soft organic shadow profiles */
      --shadow-sm: 0 4px 12px rgba(76, 50, 46, 0.03);
      --shadow-md: 0 12px 36px rgba(76, 50, 46, 0.06);
      --shadow-lg: 0 24px 54px rgba(76, 50, 46, 0.08);
      --shadow-gold: 0 8px 24px rgba(166, 116, 72, 0.1);
      --shadow-blush: 0 8px 24px rgba(219, 39, 119, 0.15);
      
      --transition-smooth: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      --transition-fast: all 0.2s ease;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      color: var(--color-text);
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    img { max-width: 100%; display: block; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ===== Announcement bar ===== */
    .announce-bar {
      background: var(--color-blush); color: #fff; overflow: hidden;
      white-space: nowrap; position: relative; height: 38px; display: flex; align-items: center;
    }
    .announce-track {
      display: inline-flex; animation: scrollBar 18s linear infinite; white-space: nowrap;
    }
    .announce-track span {
      padding: 0 2.5rem; font-size: 0.82rem; font-weight: 500; letter-spacing: .02em;
    }
    @keyframes scrollBar { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    /* ===== Header ===== */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid #f0e6e2;
      position: sticky; top: 0; background: #fff; z-index: 100;
    }
    .header-icon {
      background: none; display: flex; align-items: center; color: var(--color-blush);
    }
    .logo { font-family: 'Playfair Display', serif; text-align: center; line-height: 0.85; cursor: pointer; }
    .logo .cosmetics-label {
      font-family: 'Poppins', sans-serif; font-size: 0.55rem; letter-spacing: 0.35em;
      color: var(--color-blush); display: block; margin-bottom: 2px; font-weight: 500;
    }
    .logo .brand-name {
      font-size: 2.1rem; font-weight: 700; color: var(--color-blush);
      font-style: italic; position: relative; display: inline-block;
    }
    .logo .brand-name .flower { font-size: 0.9rem; position: relative; top: -8px; }
    .header-actions { display: flex; gap: 18px; align-items: center; }

    /* ===== Side Menu ===== */
    .menu-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 1001;
      opacity: 0; visibility: hidden; transition: 0.3s;
    }
    .menu-overlay.active { opacity: 1; visibility: visible; }
    .menubar {
      position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
      background: #fff; z-index: 1002; transition: 0.3s;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1); padding: 20px;
    }
    .menubar.active { left: 0; }
    .menubar .close-menu {
      font-size: 1.5rem; color: var(--color-blush); background: none; border: none; cursor: pointer; margin-bottom: 20px;
    }
    .menubar ul li { margin-bottom: 15px; }
    .menubar ul li a { font-size: 1.1rem; font-weight: 500; color: var(--color-text); }
    .menubar .side-bottom-links { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; font-size: 0.9rem; }
    .menubar .side-bottom-links a { color: var(--color-muted); margin-right:10px; }

    /* ===== Hero slider ===== */
    .hero {
      position: relative; width: 100%; height: 38vw; max-height: 350px; min-height: 200px;
      overflow: hidden; background: #e9c7c0;
    }
    .hero-slide {
      position: absolute; inset: 0; display: flex; align-items: flex-end;
      background-size: cover; background-position: center; opacity: 0; transition: opacity 1s ease;
    }
    .hero-slide.active { opacity: 1; }
    .hero-slide-content, .hero-content {
      width: 100%;
      padding: 0 24px 30px;
      color: #fff; font-family: 'Playfair Display', serif;
      font-weight: 700; font-size: 2.1rem; line-height: 1.15; text-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }
    
    .hero-btn {
      display: inline-block; margin-top: 15px; padding: 10px 24px;
      background: var(--color-primary); color: #fff; border-radius: 30px;
      font-size: 1rem; font-weight: 500; font-family: 'Poppins', sans-serif;
      text-decoration: none; text-shadow: none; border: 1px solid rgba(255,255,255,0.2);
    }
    .hero-subtitle {
      font-size: 1.1rem; font-weight: 400; margin-top: 8px; font-family: 'Poppins', sans-serif;
    }
    .hero-dots {
      position: absolute; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px;
    }
    .hero-dots span {
      width: 22px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5); transition: background .3s;
    }
    .hero-dots span.active { background: #fff; }

    /* ===== Trust Bar (Redesigned & Optimized) ===== */
    .trust-bar { 
      display: flex; 
      justify-content: space-around; 
      align-items: stretch;
      padding: 24px 15px; 
      background: linear-gradient(180deg, #ffffff 0%, var(--color-surface-soft) 100%); 
      text-align: center; 
      gap: 12px;
      border-bottom: 1px solid #f0e6e2;
      min-height: 140px; /* Prevents CLS */
    }
    .trust-item { 
      flex: 1; 
      padding: 16px 8px;
      background: #ffffff;
      border-radius: var(--border-radius-md);
      box-shadow: var(--shadow-sm);
      transition: var(--transition-smooth);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .trust-item:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }
    .trust-item i, .trust-item svg { 
      font-size: 1.8rem; 
      margin-bottom: 10px; 
      color: var(--color-primary);
      display: block; 
    }
    .trust-item p { 
      font-size: 0.75rem; 
      color: var(--color-text); 
      margin-top: 4px; 
      line-height: 1.4; 
    }
    .trust-item p strong {
      display: block;
      color: var(--color-primary);
      font-size: 0.9rem;
      margin-bottom: 3px;
      font-weight: 600;
    }

    /* ===== Section titles ===== */
    .section { padding: 40px 20px 8px; }
    .section-title {
      font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic;
      text-align: center; font-size: 2rem; color: var(--color-blush); margin-bottom: 28px;
    }
    .section-title.plain { font-style: normal; color: #111; font-family: 'Poppins', sans-serif; font-weight: 600; }

    /* dynamic sections wrapper CLS protection */
    #dynamic-sections-wrapper { min-height: 50vh; }

    /* ===== Product grid ===== */
    .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding-bottom: 10px; }
    .product-card { display: flex; flex-direction: column; }
    .product-image-wrap {
      position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 1/1;
      background: linear-gradient(135deg, #f3c9be, #f6dad2); margin-bottom: 10px;
    }
    .product-image-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .discount-badge {
      position: absolute; top: 10px; left: 10px; background: var(--color-danger); color: #fff;
      font-size: 0.78rem; font-weight: 700; padding: 4px 9px; border-radius: 4px; z-index:2;
    }
    .add-cart-btn {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: var(--color-primary); color: #fff; padding: 10px 18px; border-radius: 30px;
      font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 6px;
      width: 88%; justify-content: center; white-space: nowrap; z-index:2; border:none; cursor:pointer;
    }
    .add-cart-btn:hover { background: #be185d !important; background: var(--color-primary-hover) !important; border-color: var(--color-primary-hover) !important; }
    .add-cart-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
    .product-title {
      font-size: 0.92rem; color: var(--color-blush); font-weight: 500; line-height: 1.35;
      margin-bottom: 6px; min-height: 2.6em;
    }
    .product-price { font-size: 1rem; font-weight: 700; color: var(--color-danger); }
    .product-price .old-price {
      color: #b79a95; font-weight: 400; text-decoration: line-through;
      font-size: 0.88rem; margin-left: 6px;
    }
    .product-title.plain { color: #111; }

    /* ===== CTA button ===== */
    .cta-wrap { display: flex; justify-content: center; padding: 28px 20px 44px; }
    .shop-now-btn {
      background: var(--color-blush); color: #fff; padding: 16px 46px; border-radius: 40px;
      font-size: 1.05rem; font-weight: 600; box-shadow: 0 8px 20px var(--color-primary-hover); display:inline-block;
    }
    .shop-now-btn:hover { background: #be185d !important; background: var(--color-primary-hover) !important; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(219, 39, 119, 0.25); }

    /* ===== Collections ===== */
    .collection-card {
      position: relative; border-radius: 10px; overflow: hidden; margin-bottom: 26px;
      aspect-ratio: 16/13; background-size: cover; background-position: center;
    }
    .collection-info { display: flex; justify-content: space-between; align-items: center; padding: 14px 4px 0; }
    .collection-info h3 { font-size: 1.15rem; font-weight: 500; }
    .collection-info p { color: var(--color-muted); font-size: 0.88rem; margin-top: 2px; }
    .arrow-circle {
      width: 38px; height: 38px; border-radius: 50%; background: #f2f2f2;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    /* ===== Reviews ===== */
    .reviews-section { background: #f7f7f8; padding: 44px 20px; }
    .reviews-header { text-align: center; margin-bottom: 24px; }
    .reviews-header h2 {
      font-family: 'Playfair Display', serif; font-weight: 700; letter-spacing: 0.06em;
      color: var(--color-blush); font-size: 1.5rem; margin-bottom: 10px;
    }
    .stars { color: #f6c343; font-size: 1.3rem; letter-spacing: 2px; }
    .review-shots {
      display: flex; gap: 12px; overflow-x: auto; padding: 6px 2px 20px; scrollbar-width: none;
    }
    .review-shots::-webkit-scrollbar { display: none; }
    .review-shot {
      flex: 0 0 auto; width: 200px; height: 230px; border-radius: 14px; background: #1c1c1e;
      color: #fff; padding: 16px; font-size: 0.8rem; line-height: 1.5; position: relative; direction: rtl; text-align: right;
    }
    .review-shot .time { position: absolute; bottom: 12px; right: 16px; font-size: 0.7rem; color: #aaa; direction: ltr; }
    .review-card {
      background: #fff; border-radius: 16px; padding: 26px 22px; box-shadow: 0 6px 24px rgba(0,0,0,0.06); position: relative;
    }
    .top-review-tag {
      position: absolute; top: -14px; right: 20px; background: var(--color-blush); color: #fff;
      font-size: 0.78rem; font-weight: 600; padding: 6px 16px; border-radius: 20px; display: flex; align-items: center; gap: 5px;
    }
    .review-card h3 { font-size: 1.15rem; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .review-card p { font-size: 0.92rem; line-height: 1.7; color: var(--color-text); }
    .review-card p b { color: var(--color-blush); }

    /* ===== Footer ===== */
    footer { background: var(--color-primary); color: #fff; padding: 56px 24px 30px; }
    .footer-logo {
      font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700;
      font-size: 2.6rem; margin-bottom: 22px;
    }
    .footer-logo .cosmetics-label {
      display: block; font-family: 'Poppins', sans-serif; font-style: normal;
      font-size: 0.6rem; letter-spacing: 0.35em; margin-bottom: 4px; font-weight: 500;
    }
    footer .tagline { font-style: italic; font-size: 1.2rem; line-height: 1.5; margin-bottom: 30px; max-width: 420px; }
    .footer-menu { border-top: 1px solid rgba(255,255,255,0.25); }
    .footer-menu-item {
      display: flex; justify-content: space-between; align-items: center; padding: 20px 0;
      border-bottom: 1px solid rgba(255,255,255,0.25); font-size: 1.15rem; font-weight: 500;
    }
    .footer-social { display: flex; gap: 18px; margin: 34px 0 26px; }
    .footer-social a {
      width: 38px; height: 38px; border: 1.5px solid #fff; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    footer .copyright { font-size: 0.85rem; color: #d9bfc9; }
    footer .copyright a { text-decoration: underline; }

    /* ===== Bottom nav ===== */
    .bottom-nav {
      position: sticky; bottom: 0; background: #fff; border-top: 1px solid #eee;
      display: flex; justify-content: space-around; padding: 8px 0 10px; z-index: 90;
    }
    .bottom-nav a {
      display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.68rem; color: var(--color-text); font-weight: 500; position:relative;
    }
    .bottom-nav svg { width: 20px; height: 20px; }
    
    .whatsapp-float {
      position: fixed; bottom: 70px; right: 16px; width: 50px; height: 50px;
      background: #25D366; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25); z-index: 95;
    }

    /* Desktop Adjustments */
    @media(min-width: 720px) {
      .product-grid { grid-template-columns: repeat(4, 1fr); }
      .review-shots { justify-content: center; }
      .benefits-grid { grid-template-columns: repeat(3, 1fr) !important; }
      
      /* Incremental space for Desktop Hero as requested */
      .hero {
        height: 45vw;
        max-height: 550px; /* Increased from 350px for desktop view */
      }
    }

  <div class="trust-bar" id="trustBarContainer"></div>

  <div id="dynamic-sections-wrapper"></div>

  <section class="section" id="sec-categories">
    <h2 class="section-title plain" id="sec-categories-title">Collections</h2>
    <div id="dynamic-categories" style="min-height: 200px;"></div>
  </section>

  <section class="section" style="background:#f7f7f8;">
    <h2 class="section-title plain">Why Choose Us</h2>
    <div class="benefits-grid" id="benefitsContainer" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; min-height: 100px;"></div>
  </section>

  <div id="dynamic-reviews-wrapper"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  
    <script>
  const firebaseConfig = {
    apiKey: "AIzaSyDqYY4EF0Nig9aBOxmWZJA8D-4Gr4tT-UU",
    authDomain: "dandy-562fc.firebaseapp.com",
    databaseURL: "https://dandy-562fc-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "dandy-562fc",
    storageBucket: "dandy-562fc.appspot.com",
    messagingSenderId: "454972972842",
    appId: "1:454972972842:web:fedc5e92e258a06ca08853"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  let globalProductsCache = {};

  document.addEventListener('DOMContentLoaded', () => {
      // 1. Fetch products ONCE
      db.ref('products').once('value').then(snap => {
          if(snap.exists()) {
              globalProductsCache = snap.val();
          }
          // Now fetch dynamic homepage layout
          loadHomepageDynamic();
      });
  });

  function loadHomepageDynamic() {
      db.ref('homepage').once('value').then(snap => {
          if(!snap.exists()) return;
          const data = snap.val();
          
          // Hero
          renderHero(data.dynamicHero);
          
          // Trust
          renderTrust(data.trust);

          // Sections
          renderSections(data.dynamicSections);

          // Reviews
          renderReviews(data.dynamicReviews);
      });

      // Load Categories
      db.ref('categories').once('value').then(snap => {
          if(!snap.exists()) return;
          let catHtml = '<div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:0 20px;">';
          snap.forEach(child => {
              const c = child.val();
              catHtml += `
                <a href="pages/shop/all-products.html?category=${encodeURIComponent(c.name)}" class="new-category-card">
                  <img src="${c.image || ''}" alt="${c.name}" loading="lazy" style="width:100%; height:100%; object-fit:cover;">
                  <div class="overlay-content">
                    <div class="tagline">${c.tagline || 'COLLECTION'}</div>
                    <h3>${c.name}</h3>
                    <div class="bottom-bar">
                      <div class="item-count">${c.count || ''}</div>
                      <div class="arrow-icon"><i class="fas fa-arrow-right"></i></div>
                    </div>
                  </div>
                </a>
              `;
          });
          catHtml += '</div>';
          const dc = document.getElementById('dynamic-categories');
          if(dc) dc.innerHTML = catHtml;
      });

      // Benefits
      db.ref('settings/benefits').once('value').then(snap => {
          const container = document.getElementById('benefitsContainer');
          if(snap.exists() && container) {
            let html = '';
            snap.forEach(child => {
              let b = child.val();
              html += `<div class="benefit-item" style="text-align:center;"><div style="font-size:2rem;margin-bottom:8px;">${b.icon || '✨'}</div><h3 style="font-size:1rem;margin-bottom:4px;">${b.title || ''}</h3><p style="font-size:0.8rem;color:var(--color-muted);">${b.subtitle || ''}</p></div>`;
            });
            container.innerHTML = html;
          }
      });
  }

  function renderHero(slides) {
      const heroSlider = document.getElementById('heroSlider');
      const heroDots = document.getElementById('heroDots');
      if (!slides || !slides.length || !heroSlider || !heroDots) return;
      
      heroSlider.innerHTML = '';
      heroDots.innerHTML = '';
      
      slides.forEach((slide, idx) => {
          const isActive = idx === 0 ? 'active' : '';
          heroSlider.innerHTML += `<div class="hero-slide ${isActive}" style="background-image:url('${slide.image || ''}')"><div class="hero-content"><h1 class="hero-title">${slide.title || ''}</h1><p class="hero-subtitle">${slide.subtitle || ''}</p></div></div>`;
          heroDots.innerHTML += `<div class="dot ${isActive}"></div>`;
      });
      
      let currentSlide = 0;
      let slideInterval;
      const slideElements = document.querySelectorAll('.hero-slide');
      const dotElements = document.querySelectorAll('.dot');
      
      function goToSlide(index) {
          if(!slideElements[currentSlide] || !slideElements[index]) return;
          slideElements[currentSlide].classList.remove('active');
          dotElements[currentSlide].classList.remove('active');
          void dotElements[index].offsetWidth; // reflow
          currentSlide = index;
          slideElements[currentSlide].classList.add('active');
          dotElements[currentSlide].classList.add('active');
      }
      
      function startSlider() {
          clearInterval(slideInterval);
          const dur = (slides[currentSlide] && slides[currentSlide].duration ? slides[currentSlide].duration * 1000 : 5000);
          slideInterval = setInterval(() => {
              goToSlide((currentSlide + 1) % slideElements.length);
              startSlider(); 
          }, dur);
      }
      
      if (slideElements.length > 1) {
          dotElements.forEach((dot, idx) => {
              dot.addEventListener('click', () => {
                  goToSlide(idx);
                  startSlider();
              });
          });
          startSlider();
      }
  }

  function renderTrust(trustData) {
      const tb = document.getElementById('trustBarContainer');
      if(!tb || !trustData) return;
      let html = '';
      for(let i=1; i<=3; i++) {
          const itm = trustData['item'+i];
          if(itm && itm.title) {
             let iconHtml = itm.icon.includes('<') ? itm.icon : `<i class="${itm.icon}"></i>`;
             if(!itm.icon.includes('fa-') && !itm.icon.includes('<')) iconHtml = `<i>${itm.icon}</i>`;
             html += `<div class="trust-item">${iconHtml}<p><strong>${itm.title}</strong><br>${itm.desc||''}</p></div>`;
          }
      }
      tb.innerHTML = html;
  }

  function renderSections(sections) {
      const wrapper = document.getElementById('dynamic-sections-wrapper');
      if(!wrapper || !sections) return;
      
      let html = '';
      sections.sort((a,b) => (a.order||0) - (b.order||0));

      const colors = ['var(--color-surface-soft)', 'var(--color-blush-soft)']; 
      let visibleIdx = 0;

      sections.forEach(sec => {
          if(!sec.visible) return;
          
          let prodsToRender = [];
          
          if(sec.type === 'bestsellers') {
              for(let key in globalProductsCache) {
                  if(globalProductsCache[key].bestseller && !globalProductsCache[key].isHidden) {
                      prodsToRender.push({...globalProductsCache[key], id: key});
                  }
              }
              prodsToRender = prodsToRender.slice(0, 8);
          } else if(sec.type === 'offers') {
              for(let key in globalProductsCache) {
                  if((globalProductsCache[key].onSale || globalProductsCache[key].discount) && !globalProductsCache[key].isHidden) {
                      prodsToRender.push({...globalProductsCache[key], id: key});
                  }
              }
              prodsToRender = prodsToRender.slice(0, 8);
          } else if(sec.type === 'manual') {
              for(let key in sec.manualProducts) {
                  if(sec.manualProducts[key] && globalProductsCache[key] && !globalProductsCache[key].isHidden) {
                      prodsToRender.push({...globalProductsCache[key], id: key});
                  }
              }
          }
          
          if(prodsToRender.length === 0) return;

          const bgColor = colors[visibleIdx % 2];
          visibleIdx++;

          let gridHtml = '';
          prodsToRender.forEach(prod => {
              let priceStr = `<div class="product-price">${prod.price} EGP</div>`;
              let badgeStr = '';
              if(prod.discount || prod.onSale) {
                  let discountText = prod.discount ? `Sale ${prod.discount}%` : 'Sale';
                  badgeStr = `<div class="discount-badge">${discountText}</div>`;
                  if (prod.originalPrice) { 
                      priceStr = `<div class="product-price"><span class="old-price" style="text-decoration:line-through;color:var(--color-muted);font-size:0.8rem;margin-right:6px;">${prod.originalPrice} EGP</span>${prod.price} EGP</div>`;
                  }
              }
              gridHtml += `
                <div class="product-card" onclick="window.location.href='pages/shop/product.html?id=${prod.id}'">
                  <div class="product-image-wrap">
                    ${badgeStr}
                    <img src="${prod.image || ''}" alt="${prod.name || 'Product'}" loading="lazy" width="100%" height="100%">
                    <button class="add-cart-btn" onclick="event.stopPropagation(); addToCart('${prod.id}', '${(prod.name||'').replace(/'/g, "'")}', ${prod.price}, '${prod.image||''}')">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 01-8 0"/></svg>
                      Add
                    </button>
                  </div>
                  <h3 class="product-title">${prod.name || ''}</h3>
                  ${priceStr}
                </div>
              `;
          });

          html += `
            <section class="section" id="${sec.id}" style="background:${bgColor};padding-bottom:6px;">
              <h2 class="section-title">${sec.title}</h2>
              ${sec.subtitle ? `<p style="text-align:center; color:var(--color-blush); margin-top:-20px; margin-bottom:20px;">${sec.subtitle}</p>` : ''}
              <div class="product-grid">${gridHtml}</div>
            </section>
            <div class="cta-wrap" style="background:${bgColor};">
              <a href="pages/shop/all-products.html" class="shop-now-btn">Shop Now ✨</a>
            </div>
          `;
      });
      
      wrapper.innerHTML = html;
  }

  function renderReviews(reviews) {
      const wrapper = document.getElementById('dynamic-reviews-wrapper');
      if(!wrapper || !reviews || !reviews.length) return;
      
      let html = `
        <section class="reviews-section">
          <div class="reviews-header">
            <h2>CUSTOMER FEEDBACK</h2>
            <div class="stars">★★★★★</div>
          </div>
          <div class="review-shots" style="display:flex; gap:16px; overflow-x:auto; padding-bottom:10px;">
      `;
      
      reviews.forEach(r => {
          html += `
            <div class="review-card" style="min-width:280px; flex-shrink:0;">
              <span class="top-review-tag">★ Verified Buyer</span>
              <p style="margin-bottom:10px;">"${r.text}"</p>
              <div style="display:flex; align-items:center; gap:10px; margin-top:15px; border-top:1px solid #eee; padding-top:10px;">
                  ${r.image ? `<img src="${r.image}" loading="lazy" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">` : ''}
                  <strong style="color:var(--color-blush);">${r.author}</strong>
              </div>
            </div>
          `;
      });
      
      html += `
          </div>
        </section>
      `;
      wrapper.innerHTML = html;
  }

  window.addToCart = function(id, name, price, image) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let exist = cart.findIndex(i => i.id === id);
    if(exist !== -1) cart[exist].quantity++;
    else cart.push({ id, name, price, image, quantity: 1 });
    localStorage.setItem("cart", JSON.stringify(cart));
    
    if (typeof window.updateSharedCartCount === 'function') {
        window.updateSharedCartCount();
    }
    
    const alertDiv = document.createElement("div");
    alertDiv.style.position = "fixed";
    alertDiv.style.bottom = "100px";
    alertDiv.style.left = "50%";
    alertDiv.style.transform = "translateX(-50%)";
    alertDiv.style.background = "var(--color-blush)";
    alertDiv.style.color = "#fff";
    alertDiv.style.padding = "10px 20px";
    alertDiv.style.borderRadius = "8px";
    alertDiv.style.zIndex = "9999";
    alertDiv.style.fontWeight = "bold";
    alertDiv.textContent = "Added to Cart!";
    document.body.appendChild(alertDiv);
    setTimeout(() => alertDiv.remove(), 2000);
  };
  </script>
